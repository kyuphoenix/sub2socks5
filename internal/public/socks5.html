<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f0f2f5" />
  <title>SOCKS5 服务 - sub2socks5</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="container">
    <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>
    <section>
      <div class="section-heading">
        <h1>SOCKS5 服务</h1>
        <div class="section-heading-actions">
          <button id="back-home" type="button">返回主页</button>
          <button id="save-socks" type="button">保存配置</button>
        </div>
      </div>
      <div id="socks-status" class="status-bar is-idle">准备就绪</div>
    </section>

    <section>
      <div class="section-heading">
        <h2 class="service-list-title">服务列表 <span id="service-count-badge" class="editor-status compact-badge">0 个服务</span> <span id="unsaved-badge" class="editor-status compact-badge is-dirty" style="display:none">0 个服务未保存</span></h2>
        <div class="section-heading-actions">
          <button id="clear-socks" type="button" class="danger-button">删除所有 SOCKS5 服务</button>
          <button id="add-socks" type="button">+ 添加 SOCKS5 服务</button>
        </div>
      </div>
      <div id="socks-list"></div>
    </section>
  </main>

  <div id="socks-test-overlay" class="overlay is-hidden" aria-hidden="true">
    <div class="overlay-card">
      <h3>测试 SOCKS5 服务</h3>
      <div class="overlay-step" id="socks-test-step">选择测试 API</div>
      <label class="socks-test-target">
        <span>测试 API</span>
        <select id="socks-test-source">
          <option value="api.ipify.org">api.ipify.org</option>
          <option value="ifconfig.me">ifconfig.me</option>
          <option value="ip.sb">ip.sb</option>
          <option value="icanhazip.com">icanhazip.com</option>
        </select>
      </label>
      <div class="overlay-detail" id="socks-test-detail"></div>
      <div class="overlay-actions">
        <button id="socks-test-start" type="button">开始测试</button>
        <button id="socks-test-close" type="button" class="danger-icon-button">取消</button>
      </div>
    </div>
  </div>
  <script type="module" src="/socks5.js"></script>
</body>
</html>
