<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f0f2f5" />
  <title>SOCKS5 服务 - sub2socks5</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="container">
    <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>
    <section>
      <div class="section-heading">
        <h1>SOCKS5 服务</h1>
        <div class="section-heading-actions">
          <button id="back-home" type="button">返回主页</button>
          <button id="save-socks" type="button">保存配置</button>
        </div>
      </div>
      <div id="socks-status" class="status-bar is-idle">准备就绪</div>
    </section>

    <section>
      <div class="section-heading">
        <h2 class="service-list-title">服务列表 <span id="service-count-badge" class="editor-status compact-badge">0 个服务</span> <span id="unsaved-badge" class="editor-status compact-badge is-dirty" style="display:none">0 个服务未保存</span></h2>
        <div class="section-heading-actions">
          <button id="clear-socks" type="button" class="danger-button">删除所有 SOCKS5 服务</button>
          <button id="add-socks" type="button">+ 添加 SOCKS5 服务</button>
        </div>
      </div>
      <div id="socks-list"></div>
    </section>
  </main>
  <script type="module" src="/socks5.js"></script>
</body>
</html>
