name: Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Binaries
    uses: ./.github/workflows/reusable-build.yml
    with:
      package_zip: true

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata from version file
        id: meta
        shell: bash
        run: |
          if [ ! -f version ]; then
            echo "Error: version file not found in repository root"
            exit 1
          fi
          RAW_VERSION=$(cat version | tr -d '[:space:]')
          if [ -z "$RAW_VERSION" ]; then
            echo "Error: version file is empty"
            exit 1
          fi

          if [[ "$RAW_VERSION" =~ ^[vV] ]]; then
            TAG="$RAW_VERSION"
          else
            TAG="v$RAW_VERSION"
          fi
          NAME="sub2socks5 $TAG"

          echo "Detected version from repository: $RAW_VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Collect archives
        shell: bash
        run: |
          mkdir -p release-upload
          find release-assets -type f -name "*.zip" -exec cp {} release-upload/ \;
          ls -la release-upload

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          append_body: false
          make_latest: true
          generate_release_notes: false
          files: release-upload/*.zip
